<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureLogin — Create Account</title>
  <meta name="description" content="Register a secure account with client-side SHA-256 password hashing.">
  
  <!-- Pre-render Theme to prevent visual flash -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('secureLoginTheme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Navbar Header -->
    <header class="navbar">
      <a href="index.html" class="brand" aria-label="SecureLogin Home">
        <span class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </span>
        <span>SecureLogin</span>
        <span class="brand-badge">Auth</span>
      </a>

      <div class="nav-actions">
        <button class="btn-icon theme-toggle" type="button" aria-label="Toggle dark/light theme" title="Toggle Theme">
          <span class="theme-toggle-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
            </svg>
          </span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="auth-page">
      <div class="auth-container">
        <div class="auth-header">
          <div class="auth-logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.766z" />
            </svg>
          </div>
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Join SecureLogin with a protected profile</p>
        </div>

        <div class="auth-card">
          <form id="register-form" class="auth-form" novalidate>
            <!-- Username Input -->
            <div class="form-group">
              <label for="register-username" class="form-label">
                <span>Username</span>
              </label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                  </svg>
                </span>
                <input 
                  type="text" 
                  id="register-username" 
                  class="form-input" 
                  placeholder="e.g. alex_dev" 
                  autocomplete="username" 
                  required
                >
              </div>
            </div>

            <!-- Email Input -->
            <div class="form-group">
              <label for="register-email" class="form-label">
                <span>Email Address</span>
              </label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                  </svg>
                </span>
                <input 
                  type="email" 
                  id="register-email" 
                  class="form-input" 
                  placeholder="name@example.com" 
                  autocomplete="email" 
                  required
                >
              </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
              <label for="register-password" class="form-label">
                <span>Password</span>
              </label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                  </svg>
                </span>
                <input 
                  type="password" 
                  id="register-password" 
                  class="form-input" 
                  placeholder="Create password" 
                  autocomplete="new-password" 
                  required
                >
                <button type="button" id="toggle-password-btn" class="btn-toggle-password" aria-label="Show password" title="Toggle password visibility"></button>
              </div>

              <!-- Password Strength Meter -->
              <div class="strength-meter">
                <div class="strength-bars">
                  <div class="strength-bar"></div>
                  <div class="strength-bar"></div>
                  <div class="strength-bar"></div>
                </div>
                <div class="strength-label-container">
                  <span>Password Strength</span>
                  <span id="strength-text" class="strength-text">None</span>
                </div>
              </div>

              <!-- Live Requirement Checklist -->
              <ul class="requirement-list" aria-live="polite">
                <li id="req-length" class="requirement-item">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                  </svg>
                  <span>At least 8 characters</span>
                </li>
                <li id="req-number" class="requirement-item">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                  </svg>
                  <span>At least 1 number</span>
                </li>
              </ul>
            </div>

            <!-- Confirm Password Input -->
            <div class="form-group">
              <label for="register-confirm-password" class="form-label">
                <span>Confirm Password</span>
              </label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
                  </svg>
                </span>
                <input 
                  type="password" 
                  id="register-confirm-password" 
                  class="form-input" 
                  placeholder="Repeat password" 
                  autocomplete="new-password" 
                  required
                >
                <button type="button" id="toggle-confirm-password-btn" class="btn-toggle-password" aria-label="Show password" title="Toggle password visibility"></button>
              </div>
              <div id="match-feedback" class="form-feedback" aria-live="polite"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="register-submit-btn" class="btn-primary">
              <span class="btn-text">Create Account</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
          </form>

          <div class="auth-footer">
            <p>Already have an account? <a href="index.html">Sign in</a></p>
          </div>
        </div>
      </div>
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
      <p>SecureLogin • Client-Side Authentication Internship Project</p>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Application Logic -->
  <script src="script.js"></script>
</body>
</html>
