<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureLogin — Sign In</title>
  <meta name="description" content="Secure client-side authentication system with Web Crypto SHA-256 and localStorage session management.">
  
  <!-- Pre-render Theme to prevent visual flash -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('secureLoginTheme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Navbar Header -->
    <header class="navbar">
      <a href="index.html" class="brand" aria-label="SecureLogin Home">
        <span class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </span>
        <span>SecureLogin</span>
        <span class="brand-badge">Auth</span>
      </a>

      <div class="nav-actions">
        <button class="btn-icon theme-toggle" type="button" aria-label="Toggle dark/light theme" title="Toggle Theme">
          <span class="theme-toggle-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
            </svg>
          </span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="auth-page">
      <div class="auth-container">
        <div class="auth-header">
          <div class="auth-logo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
            </svg>
          </div>
          <h1 class="auth-title">SecureLogin</h1>
          <p class="auth-subtitle">Simple. Secure. Beautiful.</p>
        </div>

        <div class="auth-card">
          <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--text-primary);">Welcome Back</h2>
          
          <form id="login-form" class="auth-form" novalidate>
            <!-- Username or Email Input -->
            <div class="form-group">
              <label for="login-identifier" class="form-label">
                <span>Username or Email</span>
              </label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                  </svg>
                </span>
                <input 
                  type="text" 
                  id="login-identifier" 
                  class="form-input" 
                  placeholder="Enter your username or email" 
                  autocomplete="username" 
                  required
                >
              </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
              <label for="login-password" class="form-label">
                <span>Password</span>
              </label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                  </svg>
                </span>
                <input 
                  type="password" 
                  id="login-password" 
                  class="form-input" 
                  placeholder="Enter your password" 
                  autocomplete="current-password" 
                  required
                >
                <button type="button" id="toggle-password-btn" class="btn-toggle-password" aria-label="Show password" title="Toggle password visibility"></button>
              </div>
            </div>

            <!-- Options: Remember Me -->
            <div class="form-options">
              <label class="checkbox-container">
                <input type="checkbox" id="remember-me">
                <span>Remember me</span>
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="login-submit-btn" class="btn-primary">
              <span class="btn-text">Sign In</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
          </form>

          <div class="auth-footer">
            <p>Don't have an account? <a href="register.html">Create account</a></p>
          </div>
        </div>
      </div>
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
      <p>SecureLogin • Client-Side Authentication Internship Project</p>
    </footer>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Application Logic -->
  <script src="script.js"></script>
</body>
</html>
